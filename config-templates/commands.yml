# QQ 白名单控制台命令。修改后执行 /shitbot reload。
enabled: true

# 代理等待子服回包的基础超时；实际超时不会短于 capture-seconds + 5 秒。
request-timeout-seconds: 15
command-cooldown-seconds: 5

# 自定义图片模板的群命令。只有 config.yml 中 custom-image-templates.enabled=true 时可用。
image-templates:
  commands:
    online-status:
      enabled: false
      aliases:
        - "自定义在线"
      template: "online-status"
      # bound：使用该 QQ 最新绑定；argument：命令后必须跟该 QQ 已绑定的角色名；none：不读取绑定。
      player-source: "bound"
      # 代理部署可指定处理权限/PAPI 的 Spigot 子服；Nukkit 不支持 Bukkit PlaceholderAPI，请保持为空。
      target-server: ""
      permission: ""
      cooldown-seconds: 10
      usage: "%at% 用法：自定义在线 [已绑定角色名]"
      failed: "%at% 图片生成失败：%result%"
    player-profile:
      enabled: false
      aliases:
        - "自定义个人信息"
        - "custom profile"
      template: "player-profile"
      player-source: "bound"
      target-server: ""
      permission: ""
      cooldown-seconds: 10
      usage: "%at% 用法：自定义个人信息"
      failed: "%at% 个人信息图片生成失败：%result%"
    inventory:
      enabled: false
      aliases:
        - "自定义背包"
        - "custom inventory"
      template: "inventory"
      player-source: "bound"
      target-server: ""
      permission: ""
      cooldown-seconds: 10
      usage: "%at% 用法：自定义背包"
      failed: "%at% 背包图片生成失败：%result%"

tps:
  enabled: true
  # 留空表示任何群成员都能查询。
  permission: ""
  # 代理可指定子服名；留空时优先选择绑定角色所在子服。Nukkit-MOT 请保持为空。
  server: ""

shortcuts:
  luckperms-editor:
    enabled: true
    command: "lp editor"
    permission: "shitbot.admin"
    # 即使 permission 留空也默认要求 QQ 已绑定；仅在明确接受群内未绑定成员调用时改为 true。
    allow-unbound: false
    # backend：在 Bukkit 子服执行；proxy：在 BungeeCord/Velocity 代理执行。
    # 单 Bukkit 或 Nukkit-MOT 部署始终在本服执行。
    target: "backend"
    # backend 目标可指定子服名；留空时优先选择绑定角色所在子服。Nukkit-MOT 请保持为空。
    server: ""
    # 执行前记录日志位置（Java 版 logs/latest.log，Nukkit-MOT logs/server.log），等待后读取新增日志。
    capture-seconds: 5
