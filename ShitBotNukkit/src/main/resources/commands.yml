# QQ 白名单控制台命令。修改后执行 /shitbot reload。
enabled: true

# 代理等待子服回包的基础超时；实际超时不会短于 capture-seconds + 5 秒。
request-timeout-seconds: 15
command-cooldown-seconds: 5

# Nukkit-MOT 为单服平台，不需要代理端后端传输配置。

messages:
  not-bound: "%at% 请先绑定游戏 ID。"
  # 在线角色使用 Nukkit 权限；离线角色可由 LuckPerms 查询。
  no-permission: "%at% 你绑定的角色没有权限执行该操作。"
  unavailable: "%at% Nukkit-MOT 命令服务不可用，或请求执行超时。"
  # 命令已经提交但没有及时捕获到结果时使用，保留 %result% 可显示防重复执行提示。
  result-timeout: "%at% %result%"
  invalid-target: "%at% 用法：%command% [目标子服]"

tps:
  enabled: true
  aliases:
    - "TPS"
    - "服务器TPS"
  # 留空表示任何群成员都能查询。
  permission: ""
  # Nukkit-MOT 为单服平台，请保持为空。
  server: ""
  message: "%at% 服务器 TPS（%source%）：%result%"
  failed: "%at% TPS 获取失败：%result%"

shortcuts:
  luckperms-editor:
    enabled: true
    aliases:
      - "lp编辑"
    command: "lp editor"
    permission: "shitbot.admin"
    # 即使 permission 留空也默认要求 QQ 已绑定；仅在明确接受群内未绑定成员调用时改为 true。
    allow-unbound: false
    # Nukkit-MOT 为单服平台，命令始终在本服执行。
    target: "backend"
    # Nukkit-MOT 不需要指定目标子服，请保持为空。
    server: ""
    # 执行前记录 logs/server.log 的位置，等待指定秒数后读取这期间新增的日志。
    capture-seconds: 5
    message: "%at% 执行成功（%source%）：\n%result%"
    failed: "%at% 执行失败（%source%）：\n%result%"
