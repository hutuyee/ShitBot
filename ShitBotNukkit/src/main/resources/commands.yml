# QQ 白名单控制台命令。修改后执行 /shitbot reload。
enabled: true

# 代理等待子服回包的基础超时；实际超时不会短于 capture-seconds + 5 秒。
request-timeout-seconds: 15
command-cooldown-seconds: 5

# 自定义图片模板的群命令。只有 config.yml 中 custom-image-templates.enabled=true 时可用。
image-templates:
  commands:
    online-status:
      enabled: false
      aliases:
        - "自定义在线"
      template: "online-status"
      # bound：使用该 QQ 最新绑定；argument：命令后必须跟该 QQ 已绑定的角色名；none：不读取绑定。
      player-source: "bound"
      # Nukkit 不支持 Bukkit PlaceholderAPI；target-server 请保持为空。
      target-server: ""
      permission: ""
      cooldown-seconds: 10
      usage: "%at% 用法：自定义在线 [已绑定角色名]"
      failed: "%at% 图片生成失败：%result%"

# Nukkit-MOT 为单服平台，不需要代理端后端传输配置。

tps:
  enabled: true
  # 留空表示任何群成员都能查询。
  permission: ""
  # Nukkit-MOT 为单服平台，请保持为空。
  server: ""

shortcuts:
  luckperms-editor:
    enabled: true
    command: "lp editor"
    permission: "shitbot.admin"
    # 即使 permission 留空也默认要求 QQ 已绑定；仅在明确接受群内未绑定成员调用时改为 true。
    allow-unbound: false
    # Nukkit-MOT 为单服平台，命令始终在本服执行。
    target: "backend"
    # Nukkit-MOT 不需要指定目标子服，请保持为空。
    server: ""
    # 执行前记录 logs/server.log 的位置，等待指定秒数后读取这期间新增的日志。
    capture-seconds: 5
