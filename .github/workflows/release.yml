name: Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  release:
    types:
      - published

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean package

      - name: Prepare plugin JAR files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          modules=(
            "ShitBotSpigot"
            "ShitBotBungee"
            "ShitBotVelocity"
            "ShitBotNukkit"
          )

          for module in "${modules[@]}"; do
            target_dir="${module}/target"

            echo "Checking module: ${module}"

            if [[ ! -d "${target_dir}" ]]; then
              echo "::error title=Missing build output::Directory ${target_dir} does not exist."
              exit 1
            fi

            mapfile -t jars < <(
              find "${target_dir}" \
                -maxdepth 1 \
                -type f \
                -name "*.jar" \
                ! -name "original-*.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                ! -name "*-tests.jar" \
                ! -name "*-test.jar" \
                -print \
              | sort
            )

            if [[ "${#jars[@]}" -eq 0 ]]; then
              echo "::error title=Missing plugin JAR::No plugin JAR was generated for ${module}."
              echo "Contents of ${target_dir}:"
              ls -lah "${target_dir}"
              exit 1
            fi

            if [[ "${#jars[@]}" -gt 1 ]]; then
              echo "::error title=Ambiguous plugin JAR::More than one candidate JAR was generated for ${module}."

              printf 'Candidate: %s\n' "${jars[@]}"

              echo "Contents of ${target_dir}:"
              ls -lah "${target_dir}"
              exit 1
            fi

            jar_file="${jars[0]}"
            jar_name="$(basename "${jar_file}")"

            jar_size="$(stat -c '%s' "${jar_file}")"
            if [[ "${jar_size}" -gt 1048576 ]]; then
              echo "::error title=Plugin size limit exceeded::${jar_name} is ${jar_size} bytes; platform plugins must stay within 1 MiB."
              exit 1
            fi

            echo "Copying ${jar_file} -> release/${jar_name}"
            cp "${jar_file}" "release/${jar_name}"
            (
              cd release
              sha256sum "${jar_name}" > "${jar_name}.sha256"
            )
          done

          mapfile -t renderer_jars < <(
            find ShitBotRenderer/target \
              -maxdepth 1 \
              -type f \
              -name "ShitBotRenderer-*.jar" \
              ! -name "original-*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              -print \
            | sort
          )

          if [[ "${#renderer_jars[@]}" -ne 1 ]]; then
            echo "::error title=Renderer artifact error::Expected one optional ShitBotRenderer JAR, found ${#renderer_jars[@]}."
            exit 1
          fi

          renderer_file="${renderer_jars[0]}"
          renderer_name="$(basename "${renderer_file}")"
          renderer_size="$(stat -c '%s' "${renderer_file}")"
          if [[ "${renderer_size}" -gt 1048576 ]]; then
            echo "::error title=Renderer size limit exceeded::${renderer_name} is ${renderer_size} bytes; the optional renderer must stay within 1 MiB."
            exit 1
          fi
          cp "${renderer_file}" "release/${renderer_name}"
          (
            cd release
            sha256sum "${renderer_name}" > "${renderer_name}.sha256"
          )

          echo
          echo "Generated plugin JAR files:"
          ls -lah release

          mapfile -t release_jars < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -print \
            | sort
          )

          if [[ "${#release_jars[@]}" -ne 5 ]]; then
            echo "::error title=Unexpected artifact count::Expected 4 plugin JARs and 1 optional renderer JAR, found ${#release_jars[@]}."
            exit 1
          fi

          echo
          echo "Release files:"
          printf '%s\n' "${release_jars[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShitBot-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Upload GitHub Release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download compiled JAR files
        uses: actions/download-artifact@v4
        with:
          name: ShitBot-${{ github.sha }}
          path: release

      - name: Sign release JAR files
        env:
          SHITBOT_UPDATE_PRIVATE_KEY: ${{ secrets.SHITBOT_UPDATE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SHITBOT_UPDATE_PRIVATE_KEY}" ]]; then
            echo "::error title=Missing signing key::Repository secret SHITBOT_UPDATE_PRIVATE_KEY is required for releases."
            exit 1
          fi

          umask 077
          signing_key="$(mktemp)"
          trap 'rm -f "${signing_key}"' EXIT
          printf '%s' "${SHITBOT_UPDATE_PRIVATE_KEY}" > "${signing_key}"

          for jar_file in release/*.jar; do
            openssl dgst \
              -sha256 \
              -sign "${signing_key}" \
              -out "${jar_file}.sig" \
              "${jar_file}"
          done

      - name: Verify release JAR files
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded release files:"
          ls -lah release

          mapfile -t jars < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -print \
            | sort
          )

          if [[ "${#jars[@]}" -ne 5 ]]; then
            echo "::error title=Unexpected release artifact count::Expected 4 plugin JARs and 1 optional renderer JAR, found ${#jars[@]}."
            exit 1
          fi

          mapfile -t checksums < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar.sha256" \
              -print \
            | sort
          )

          if [[ "${#checksums[@]}" -ne 5 ]]; then
            echo "::error title=Unexpected checksum count::Expected exactly 5 SHA-256 files, found ${#checksums[@]}."
            exit 1
          fi

          mapfile -t signatures < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar.sig" \
              -print \
            | sort
          )

          if [[ "${#signatures[@]}" -ne 5 ]]; then
            echo "::error title=Unexpected signature count::Expected exactly 5 detached signatures, found ${#signatures[@]}."
            exit 1
          fi

          (
            cd release
            sha256sum --check *.jar.sha256
          )

          printf 'Ready to upload: %s\n' "${jars[@]}"

      - name: Upload JAR files and checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Uploading JAR files and checksums:"
          ls -lah release

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            release/* \
            --repo "${{ github.repository }}" \
            --clobber
