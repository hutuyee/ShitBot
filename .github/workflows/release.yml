name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build project
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare JAR files
        shell: bash
        run: |
          mkdir -p release

          find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "original-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp "{}" release/ \;

          echo "Generated JAR files:"
          ls -lah release

          if ! find release -maxdepth 1 -type f -name "*.jar" | grep -q .; then
            echo "No plugin JAR was generated."
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusicBridge-${{ github.sha }}
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Upload GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download compiled JAR
        uses: actions/download-artifact@v4
        with:
          name: BiliMusicBridge-${{ github.sha }}
          path: release

      - name: Clear release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf "" > EMPTY_RELEASE_NOTES.md

          gh release edit \
            "${{ github.event.release.tag_name }}" \
            --notes-file EMPTY_RELEASE_NOTES.md

      - name: Upload JAR to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Uploading:"
          ls -lah release

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            release/*.jar \
            --clobber