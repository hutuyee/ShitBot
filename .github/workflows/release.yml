name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  version:
    name: Check build and release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version and validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: python .github/scripts/resolve-version.py

  test:
    name: Shared compatibility tests / Java ${{ matrix.java }} / ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "8"
          - os: ubuntu-latest
            java: "17"
          - os: windows-latest
            java: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      - name: Test shared modules without packaging
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress --errors
          -pl ShitBotApi,ShitBotCore,ShitBotRenderer -am
          "-Drevision=${BUILD_VERSION}"
          -DskipTests=false -Dmaven.test.skip=false clean test

      - name: Summarize test results
        if: always()
        shell: bash
        run: python .github/scripts/summarize-tests.py ShitBotApi ShitBotCore ShitBotRenderer

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java }}-${{ github.run_attempt }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

  build:
    name: All platforms / Java 21 / Linux
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      - name: Test and build all platforms
        shell: bash
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            "-Drevision=${BUILD_VERSION}" \
            -DskipTests=false \
            -Dmaven.test.skip=false \
            clean verify

      - name: Summarize test results
        if: always()
        shell: bash
        run: >-
          python .github/scripts/summarize-tests.py
          ShitBotApi ShitBotCore ShitBotRenderer ShitBotSpigot
          ShitBotBungee ShitBotVelocity ShitBotNukkit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-all-platforms-java-21-${{ github.run_attempt }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare plugin JAR files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          modules=(
            "ShitBotApi"
            "ShitBotSpigot"
            "ShitBotBungee"
            "ShitBotVelocity"
            "ShitBotNukkit"
          )

          for module in "${modules[@]}"; do
            target_dir="${module}/target"

            echo "Checking module: ${module}"

            if [[ ! -d "${target_dir}" ]]; then
              echo "::error title=Missing build output::Directory ${target_dir} does not exist."
              exit 1
            fi

            mapfile -t jars < <(
              find "${target_dir}" \
                -maxdepth 1 \
                -type f \
                -name "*.jar" \
                ! -name "original-*.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                ! -name "*-tests.jar" \
                ! -name "*-test.jar" \
                -print \
              | sort
            )

            if [[ "${#jars[@]}" -eq 0 ]]; then
              echo "::error title=Missing plugin JAR::No plugin JAR was generated for ${module}."
              echo "Contents of ${target_dir}:"
              ls -lah "${target_dir}"
              exit 1
            fi

            if [[ "${#jars[@]}" -gt 1 ]]; then
              echo "::error title=Ambiguous plugin JAR::More than one candidate JAR was generated for ${module}."

              printf 'Candidate: %s\n' "${jars[@]}"

              echo "Contents of ${target_dir}:"
              ls -lah "${target_dir}"
              exit 1
            fi

            jar_file="${jars[0]}"
            jar_name="$(basename "${jar_file}")"

            echo "Copying ${jar_file} -> release/${jar_name}"
            cp "${jar_file}" "release/${jar_name}"
            (
              cd release
              sha256sum "${jar_name}" > "${jar_name}.sha256"
            )
          done

          mapfile -t renderer_jars < <(
            find ShitBotRenderer/target \
              -maxdepth 1 \
              -type f \
              -name "ShitBotRenderer-*.jar" \
              ! -name "original-*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              -print \
            | sort
          )

          if [[ "${#renderer_jars[@]}" -ne 1 ]]; then
            echo "::error title=Renderer artifact error::Expected one optional ShitBotRenderer JAR, found ${#renderer_jars[@]}."
            exit 1
          fi

          renderer_file="${renderer_jars[0]}"
          renderer_name="$(basename "${renderer_file}")"
          cp "${renderer_file}" "release/${renderer_name}"
          (
            cd release
            sha256sum "${renderer_name}" > "${renderer_name}.sha256"
          )

          echo
          echo "Generated plugin JAR files:"
          ls -lah release

          mapfile -t release_jars < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -print \
            | sort
          )

          if [[ "${#release_jars[@]}" -ne 6 ]]; then
            echo "::error title=Unexpected artifact count::Expected 4 plugin JARs, 1 public API JAR and 1 optional renderer JAR, found ${#release_jars[@]}."
            exit 1
          fi

          echo
          echo "Release files:"
          printf '%s\n' "${release_jars[@]}"

      - name: Check release contents and Java targets
        shell: bash
        run: python .github/scripts/check-artifacts.py release --version "${BUILD_VERSION}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ShitBot-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ci:
    name: CI checks
    if: always()
    needs:
      - version
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and build job to pass
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          if [[ "${VERSION_RESULT}" != "success" || "${TEST_RESULT}" != "success" || "${BUILD_RESULT}" != "success" ]]; then
            echo "::error::Version check: ${VERSION_RESULT}; shared tests: ${TEST_RESULT}; platform build: ${BUILD_RESULT}"
            exit 1
          fi

  release:
    name: Upload GitHub Release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - version
      - build
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}

    permissions:
      contents: write

    steps:
      - name: Checkout release verification key
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download compiled JAR files
        uses: actions/download-artifact@v7
        with:
          name: ShitBot-${{ github.sha }}
          path: release

      - name: Recheck downloaded release contents and versions
        shell: bash
        run: python .github/scripts/check-artifacts.py release --version "${BUILD_VERSION}"

      - name: Sign release JAR files
        env:
          SHITBOT_UPDATE_PRIVATE_KEY: ${{ secrets.SHITBOT_UPDATE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SHITBOT_UPDATE_PRIVATE_KEY}" ]]; then
            echo "::error title=Missing signing key::Repository secret SHITBOT_UPDATE_PRIVATE_KEY is required for releases."
            exit 1
          fi

          umask 077
          signing_key="$(mktemp)"
          trap 'rm -f "${signing_key}"' EXIT
          printf '%s' "${SHITBOT_UPDATE_PRIVATE_KEY}" > "${signing_key}"

          for jar_file in release/*.jar; do
            openssl dgst \
              -sha256 \
              -sign "${signing_key}" \
              -out "${jar_file}.sig" \
              "${jar_file}"
          done

      - name: Verify release JAR files
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded release files:"
          ls -lah release

          mapfile -t jars < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -print \
            | sort
          )

          if [[ "${#jars[@]}" -ne 6 ]]; then
            echo "::error title=Unexpected release artifact count::Expected 4 plugin JARs, 1 public API JAR and 1 optional renderer JAR, found ${#jars[@]}."
            exit 1
          fi

          mapfile -t checksums < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar.sha256" \
              -print \
            | sort
          )

          if [[ "${#checksums[@]}" -ne 6 ]]; then
            echo "::error title=Unexpected checksum count::Expected exactly 6 SHA-256 files, found ${#checksums[@]}."
            exit 1
          fi

          mapfile -t signatures < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.jar.sig" \
              -print \
            | sort
          )

          if [[ "${#signatures[@]}" -ne 6 ]]; then
            echo "::error title=Unexpected signature count::Expected exactly 6 detached signatures, found ${#signatures[@]}."
            exit 1
          fi

          (
            cd release
            sha256sum --check *.jar.sha256
          )

          for jar_file in "${jars[@]}"; do
            openssl dgst \
              -sha256 \
              -verify ShitBotCore/src/main/resources/haaa/shitbot/core/update/update-public-key.pem \
              -signature "${jar_file}.sig" \
              "${jar_file}"
          done

          printf 'Ready to upload: %s\n' "${jars[@]}"

      - name: Upload JAR files and checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Uploading JAR files and checksums:"
          ls -lah release

          gh release upload \
            "${RELEASE_TAG}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
