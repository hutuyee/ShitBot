name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shitbot-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish plugins
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ShitBotCore/pom.xml
            ShitBotSpigot/pom.xml
            ShitBotBungee/pom.xml
            ShitBotVelocity/pom.xml

      - name: Show build environment
        shell: pwsh
        run: |
          java -version
          mvn -version

      - name: Build all modules
        shell: pwsh
        run: mvn -B -ntp clean package

      - name: Collect release jars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'release' -Force | Out-Null

          function Copy-PluginJar {
              param(
                  [Parameter(Mandatory = $true)][string]$Module,
                  [Parameter(Mandatory = $true)][string]$ArtifactPrefix,
                  [Parameter(Mandatory = $true)][string]$OutputName
              )

              $jar = Get-ChildItem -Path "$Module/target" -File -Filter "$ArtifactPrefix-*.jar" |
                  Where-Object {
                      $_.Name -notlike 'original-*' -and
                      $_.Name -notlike '*-sources.jar' -and
                      $_.Name -notlike '*-javadoc.jar'
                  } |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1

              if ($null -eq $jar) {
                  throw "Release jar was not found for module: $Module"
              }

              Copy-Item -Path $jar.FullName -Destination "release/$OutputName" -Force
              Write-Host "Collected $($jar.Name) as $OutputName"
          }

          $safeTag = $env:RELEASE_TAG -replace '[^0-9A-Za-z._-]', '-'

          Copy-PluginJar `
              -Module 'ShitBotSpigot' `
              -ArtifactPrefix 'ShitBotSpigot' `
              -OutputName "ShitBot-Spigot-$safeTag.jar"

          Copy-PluginJar `
              -Module 'ShitBotBungee' `
              -ArtifactPrefix 'ShitBotBungee' `
              -OutputName "ShitBot-Bungee-$safeTag.jar"

          Copy-PluginJar `
              -Module 'ShitBotVelocity' `
              -ArtifactPrefix 'ShitBotVelocity' `
              -OutputName "ShitBot-Velocity-$safeTag.jar"

          $releaseFiles = Get-ChildItem -Path 'release' -File
          if ($releaseFiles.Count -ne 3) {
              throw "Expected exactly 3 release jars, but found $($releaseFiles.Count)."
          }

          $releaseFiles | ForEach-Object {
              Write-Host "Release asset: $($_.Name) ($($_.Length) bytes)"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ShitBot ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/ShitBot-Spigot-*.jar
            release/ShitBot-Bungee-*.jar
            release/ShitBot-Velocity-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
