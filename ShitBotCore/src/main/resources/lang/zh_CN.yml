# ShitBot 简体中文语言文件。
# 复制本文件并改名（例如 zh_TW.yml），翻译后在 config.yml 的 language 中填写文件名。
# 请保留所有 %变量% 与颜色代码（&0-&f、&k-&r）。

commands:
  bind:
    aliases: ["绑定", "/bind"]
    usage: "用法: 绑定 <游戏ID> <验证码>"
  online-image:
    aliases: ["服务器状态", "在线人数"]
    usage: "服务器状态"
