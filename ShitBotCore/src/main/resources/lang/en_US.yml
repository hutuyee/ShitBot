    aliases: ["TPS", "tps", "server TPS"]
    message: "%at% Server TPS (%source%): %result%"
    failed: "%at% Could not get TPS: %result%"
    single: "%value% (%source%)"
    three: "%one% / %five% / %fifteen% (%source%, 1/5/15 min)"
    native-source: "server native"
    sampled-source: "sampled"
    warming-up: "20.00 (sampling is warming up)"
    nukkit: "current %current%, average %average%, load %load%%"
  shortcuts:
    luckperms-editor:
      aliases: ["lp editor"]
      message: "%at% Command succeeded (%source%):\n%result%"
      failed: "%at% Command failed (%source%):\n%result%"
  result:
    platform-unsupported: "This platform does not support console requests."
    insecure-fallback-refused: "The target backend has no authenticated Console Socket; the insecure Plugin Message fallback was refused."
    expired-before-connect: "The request expired while waiting for a backend connection."
    circuit-open: "Connections to the target backend failed repeatedly; its circuit breaker is temporarily open."
    connect-failed: "Could not connect to the target backend: %error%"
    queue-full: "The backend request queue is full."
    permission-denied: "The bound character lacks permission %permission%"
    result-timeout: "The command was submitted, but result capture timed out. Verify its result before retrying."
    request-timeout: "The console request timed out before the command was submitted."
    command-running: "Another console command is already running."
    log-read-failed: "Could not read the log: %error%"
    no-new-log: "The command ran, but the log contains no new output."
    command-rejected: "The command does not exist or its executor rejected it."
    plugin-disabled: "Plugin disabled"
    request-cancelled: "The request timed out and was cancelled."
    execution-timeout: "The request timed out."
    console-queue-full: "The console command queue is full."
    command-error: "Command execution error: %error%"
    backend-updater-unavailable: "The backend updater has not initialized."
    update-start-failed: "Could not start the update: %error%"
    null-request: "The request is null."
    console-disabled: "QQ console commands are currently disabled."
    proxy-target-unsupported: "This platform does not support proxy execution targets."
    server-target-unsupported: "This is a standalone platform; a target backend cannot be specified."
    permission-check-failed: "Permission check failed: %error%"
    remote-update-unsupported: "This platform does not accept update requests from a proxy."
    update-request-invalid: "The update request is missing required data."
    update-version-invalid: "The update version is invalid."
    update-path-invalid: "The update file path is invalid."
    update-failed: "Update failed: %error%"
    update-up-to-date: "Already up to date at version %version%."
    update-already-installed: "Version %version% is on disk and will take effect after restart."
    update-installed: "Version %version% was verified and installed; backup: %backup%"

migration:
  file-not-found: "EasyBot database file not found: %path%"
  already-running: "Another EasyBot migration is already running"
  db-extension-required: "The migration file must have a .db extension"
  invalid-file-name: "Invalid database file name"
  direct-child-required: "The database must be placed directly in the plugin directory; enter a file name only"
  outside-data-directory: "The database file must be inside the plugin directory"
  limit-exceeded: "EasyBot migration cancelled: QQ %qq% has %source_count% Minecraft IDs in EasyBot, but ShitBot currently allows at most %limit%. Change binding.maximum-ids-per-qq%allow_multiple%, run /shitbot reload, and migrate again."
  enable-multiple: " and enable binding.allow-multiple-ids-per-qq"
  merge-limit-exceeded: "EasyBot migration cancelled: merging QQ %qq% with existing ShitBot data needs at least %required% binding slots, but only %limit% are allowed. Change binding.maximum-ids-per-qq, run /shitbot reload, and try again."
  summary: "accounts=%accounts%, QQ accounts=%qq_accounts%, linked players=%linked_players%, name fallbacks=%fallback_names%, imported=%imported%, existing=%existing%, player conflicts=%player_conflicts%, QQ conflicts=%qq_conflicts%, invalid=%invalid%, non-QQ=%non_qq%"
